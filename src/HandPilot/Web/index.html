<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HandPilot camera</title>
<style>body{margin:0;background:#192235;color:#edf3ff;font:16px system-ui}main{padding:20px}select{max-width:100%;padding:10px;background:#101522;color:white;border:1px solid #71809b;border-radius:8px;margin:0 8px 8px 0}button{background:#70e0c4;border:0;border-radius:8px;padding:12px 20px;font:inherit;cursor:pointer}#stage{position:relative;margin-top:16px;max-width:800px}video{width:100%;display:block;transform:scaleX(-1);border-radius:12px}canvas{position:absolute;inset:0;width:100%;height:100%;transform:scaleX(-1)}p{color:#b5c4df}#zone{position:absolute;left:25%;top:25%;width:50%;height:50%;border:2px dashed #70e0c4;box-sizing:border-box;pointer-events:none}#zone span{background:#101522cc;color:#70e0c4;font-size:12px;padding:3px;position:absolute;top:0;left:0}</style>
<main><label for="camera">Camera</label> <select id="camera" aria-label="Camera"><option value="">Choose a camera</option></select><button id="refresh">Find cameras</button> <button id="start" disabled>Start camera preview</button><p id="message">Press Find cameras and allow camera access, then select your PC webcam. Camera access is briefly used to discover device names. Internet is needed to load the tracker.</p><p id="performance" aria-live="off">Tracking speed will appear here.</p><div id="stage"><video id="video" autoplay playsinline muted></video><canvas id="canvas"></canvas><div id="zone"><span>Screen area</span></div></div></main>
<script type="module">
const start=document.querySelector('#start'),video=document.querySelector('#video'),canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d'),message=document.querySelector('#message');
const camera=document.querySelector('#camera'),refresh=document.querySelector('#refresh');
const send=value=>window.chrome.webview.postMessage(value);
window.chrome.webview.addEventListener('message',({data})=>{
 if(typeof data.cameraMargin!=='number' || !Number.isFinite(data.cameraMargin))return;
 const margin=Math.max(0,Math.min(.35,data.cameraMargin))*100,zone=document.querySelector('#zone');
 Object.assign(zone.style,{left:margin+'%',top:margin+'%',width:(100-2*margin)+'%',height:(100-2*margin)+'%'});
});
let worker,stream,running=false,lastTime=-1,animationId,busy=false,session=0;
let lastMetrics=0,resultCount=0,inferenceTotal=0,ageTotal=0,backend="CPU";
function loadTracker(){
 return new Promise((resolve,reject)=>{
  const active=new Worker('tracker-worker.js');worker=active;
  const timeout=setTimeout(()=>{active.terminate();reject(new Error('Tracker loading timed out. Check your internet connection.'));},60000);
  active.onerror=e=>{clearTimeout(timeout);reject(new Error(e.message || 'Tracking worker failed'));if(running){stop();start.disabled=!camera.value;status('Tracker stopped. Restart preview.');}};
  active.onmessage=({data})=>{
   if(active!==worker)return;
   if(data.type==='ready'){backend=data.backend;clearTimeout(timeout);resolve();}
   if(data.type==='error'){clearTimeout(timeout);reject(new Error(data.message));if(running){stop();start.disabled=!camera.value;status('Tracker stopped: '+data.message);}}
   if(data.type==='result'){
    busy=false;if(!running)return;
    const age=performance.now()-data.timestamp;
    const points=data.points;
    send({points:age>300 ? [] : points});
    ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#70e0c4';
    for(const p of points){ctx.beginPath();ctx.arc(p.x*canvas.width,p.y*canvas.height,4,0,Math.PI*2);ctx.fill();}
    resultCount++;inferenceTotal+=data.inferenceMs;ageTotal+=age;
    const now=performance.now();
    if(now-lastMetrics>=1000){document.querySelector('#performance').textContent=`${backend} | Tracking: ${(resultCount*1000/(now-lastMetrics)).toFixed(0)} FPS | Inference: ${(inferenceTotal/resultCount).toFixed(0)} ms | Frame age: ${(ageTotal/resultCount).toFixed(0)} ms`;resultCount=0;inferenceTotal=0;ageTotal=0;lastMetrics=now;}
   }
  };
  active.postMessage({type:'init'});
 });
}
function status(text){message.textContent=text;send({status:text});}
async function listCameras(){
 const previous=camera.value;
 const devices=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput' && d.deviceId);
 camera.replaceChildren(new Option('Choose a camera',''));
 devices.forEach((d,i)=>camera.add(new Option(d.label || `Camera ${i+1}`,d.deviceId)));
 if(devices.some(d=>d.deviceId===previous)) camera.value=previous;
 start.disabled=!camera.value || running;
 return devices.length;
}
refresh.onclick=async()=>{
 refresh.disabled=true;
 let permissionStream;
 try{
  if(!stream) permissionStream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});
  const count=await listCameras();
  status(count?'Select your PC webcam from the Camera list, then start preview.':'No cameras found. Connect a webcam and try again.');
 }catch(e){status('Unable to list cameras: '+e.message);}
 finally{permissionStream?.getTracks().forEach(t=>t.stop());refresh.disabled=false;}
};
camera.onchange=()=>{
 stop(); start.disabled=!camera.value; start.textContent='Start camera preview';
 status(camera.value?'Selected: '+camera.selectedOptions[0].text+'. Start preview when ready.':'Choose a camera.');
};
navigator.mediaDevices.addEventListener('devicechange',async()=>{
 try{const active=camera.value;await listCameras();if(active && !camera.value){stop();status('Selected camera disconnected. Choose another camera.');}}
 catch(e){status('Unable to refresh cameras: '+e.message);}
});
listCameras().catch(()=>{});
start.onclick=async()=>{
 if(!camera.value){status('Choose a camera first.');return;}
 start.disabled=true;camera.disabled=true;refresh.disabled=true;
 try{
  status('Loading hand tracker…');
  await loadTracker();
  stream=await navigator.mediaDevices.getUserMedia({video:{deviceId:{exact:camera.value},width:{ideal:480},height:{ideal:360},frameRate:{ideal:60,max:60}},audio:false});
  video.srcObject=stream;await video.play();lastTime=-1;running=true;busy=false;lastMetrics=performance.now();resultCount=0;inferenceTotal=0;ageTotal=0;canvas.width=video.videoWidth;canvas.height=video.videoHeight;
  status('Camera active: '+stream.getVideoTracks()[0].label+'. Move your open hand to point. Close and open your hand to click; hold a fist to drag.');send({ready:true});
  start.textContent='Camera active';camera.disabled=false;refresh.disabled=false;animationId=requestAnimationFrame(frame);
 }catch(e){stop();status('Unable to start camera: '+e.message);start.disabled=!camera.value;}
 finally{camera.disabled=false;refresh.disabled=false;}
};
function stop(){running=false;session++;busy=false;cancelAnimationFrame(animationId);stream?.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;worker?.terminate();worker=null;ctx.clearRect(0,0,canvas.width,canvas.height);send({ready:false});send({points:[]});}
async function frame(){
 if(!running)return;
 animationId=requestAnimationFrame(frame);
 if(busy || video.readyState<2 || video.currentTime===lastTime)return;
 busy=true;lastTime=video.currentTime;
 const currentSession=session,active=worker,timestamp=performance.now();
 try {
  // Only one frame may be in flight: skip new frames instead of building a queue.
  const bitmap=await createImageBitmap(video,{resizeWidth:480,resizeHeight:Math.max(1,Math.round(480*video.videoHeight/video.videoWidth))});
  if(!running || currentSession!==session){bitmap.close();return;}
  active.postMessage({type:'frame',bitmap,timestamp},[bitmap]);
 } catch(e) {
  if(currentSession===session){stop();status('Tracker stopped: '+e.message+'. Restart preview.');start.disabled=!camera.value;}
 }
}
window.addEventListener('pagehide',stop);
</script></html>
